<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision Drag WallRange</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body {
            background: #090d16;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            padding: 12px;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            z-index: 10;
        }
        h1 {
            font-size: 17px;
            font-weight: 700;
            color: #38bdf8;
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .viewport {
            position: relative;
            flex: 1;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* Draggable Active Crosshair */
        .active-crosshair {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            display: none;
            cursor: move;
            z-index: 10;
            pointer-events: auto;
        }
        .active-crosshair::before {
            content: '';
            position: absolute;
            top: 29px;
            left: 0;
            width: 60px;
            height: 2px;
            background: #eab308;
            box-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .active-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 29px;
            width: 2px;
            height: 60px;
            background: #eab308;
            box-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .active-dot {
            position: absolute;
            top: 27px;
            left: 27px;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px #eab308;
        }

        /* Locked Markers */
        .locked-marker {
            position: absolute;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            z-index: 5;
        }
        .locked-marker::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 0;
            width: 30px;
            height: 2px;
            background: #ef4444;
        }
        .locked-marker::after {
            content: '';
            position: absolute;
            top: 0;
            left: 14px;
            width: 2px;
            height: 30px;
            background: #ef4444;
        }

        .zoom-control-box {
            position: absolute;
            right: 14px;
            top: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 8;
            pointer-events: auto;
        }
        .zoom-label {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 700;
        }
        .zoom-control-box input[type="range"] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 8px;
            height: 100px;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .control-panel {
            background: #0f172a;
            padding: 16px;
            border-top: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            touch-action: auto;
        }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .result-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .result-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .result-value {
            font-size: 22px;
            font-weight: 700;
            color: #4ade80;
            margin-top: 2px;
        }
        .btn {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
            box-shadow: none;
        }
        .instruction-banner {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #38bdf8;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Precision Drag WallRange</h1>
        <div class="subtitle">Slide & Align Optical Measurer</div>
    </header>

    <div class="viewport" id="viewport">
        <video id="video" autoplay playsinline muted></video>
        
        <div class="zoom-control-box" id="zoomBox" style="display: none;">
            <div class="zoom-label" id="zoomText">1x</div>
            <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1">
        </div>

        <div class="overlay-layer">
            <div class="active-crosshair" id="activeCrosshair"><div class="active-dot"></div></div>
            <div class="locked-marker" id="lockedMarker1"></div>
            <div class="locked-marker" id="lockedMarker2"></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="instruction-banner" id="instructionBanner">
            Step 1: Tap <b>1. Set Left Edge</b> to place the sliding crosshair.
        </div>

        <div class="row">
            <div class="input-group">
                <label>Reference Object</label>
                <select id="presetSelect">
                    <option value="8.56">Credit Card / ID (8.56 cm)</option>
                    <option value="21.0">A4 Paper Width (21.0 cm)</option>
                    <option value="7.6">Sticky Note (7.6 cm)</option>
                    <option value="custom">Custom Size...</option>
                </select>
            </div>
            <div class="input-group" id="customGroup" style="display: none; max-width: 95px;">
                <label>Width (cm)</label>
                <input type="number" id="customSizeInput" value="10" step="0.5">
            </div>
            <div class="input-group" style="max-width: 105px;">
                <label>Phone Calibration</label>
                <input type="number" id="calibInput" value="1.0" step="0.05" min="0.5" max="2.0">
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">Estimated Distance to Wall</div>
            <div class="result-value" id="distanceVal">--</div>
        </div>

        <div class="row" id="actionRow">
            <button class="btn" id="leftBtn">1. Set Left Edge</button>
            <button class="btn btn-secondary" id="confirmLeftBtn" style="display: none; background: #22c55e; color: #fff;">Confirm Left Position</button>
            
            <button class="btn btn-secondary" id="rightBtn" disabled>2. Set Right Edge</button>
            <button class="btn btn-secondary" id="confirmRightBtn" style="display: none; background: #22c55e; color: #fff;">Confirm Right Position</button>
        </div>
        
        <button class="btn" id="calcBtn" style="display: none;">Calculate Distance</button>
        <button class="btn btn-secondary" id="resetBtn" style="display: none;">Reset Measurer</button>
    </div>

<script>
const video = document.getElementById('video');
const zoomBox = document.getElementById('zoomBox');
const zoomSlider = document.getElementById('zoomSlider');
const zoomText = document.getElementById('zoomText');
const activeCrosshair = document.getElementById('activeCrosshair');
const lockedMarker1 = document.getElementById('lockedMarker1');
const lockedMarker2 = document.getElementById('lockedMarker2');
const viewport = document.getElementById('viewport');
const instructionBanner = document.getElementById('instructionBanner');
const presetSelect = document.getElementById('presetSelect');
const customGroup = document.getElementById('customGroup');
const customSizeInput = document.getElementById('customSizeInput');
const calibInput = document.getElementById('calibInput');

const leftBtn = document.getElementById('leftBtn');
const confirmLeftBtn = document.getElementById('confirmLeftBtn');
const rightBtn = document.getElementById('rightBtn');
const confirmRightBtn = document.getElementById('confirmRightBtn');
const calcBtn = document.getElementById('calcBtn');
const resetBtn = document.getElementById('resetBtn');
const distanceVal = document.getElementById('distanceVal');

let videoTrack = null;
let currentZoom = 1;
let markingState = null; // 'left' or 'right'
let leftPoint = null;  
let rightPoint = null; 

// Crosshair position in viewport screen coordinates
let crosshairX = window.innerWidth / 2;
let crosshairY = window.innerHeight / 2;
let isDraggingCrosshair = false;

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: { ideal: 'environment' },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
            zoomSlider.min = capabilities.zoom.min;
            zoomSlider.max = capabilities.zoom.max;
            zoomSlider.step = capabilities.zoom.step || 0.1;
            zoomSlider.value = videoTrack.getSettings().zoom || 1;
            currentZoom = parseFloat(zoomSlider.value);
            zoomText.textContent = currentZoom.toFixed(1) + 'x';
            zoomBox.style.display = 'flex';
        }
    } catch (err) {
        alert('Camera access denied or unavailable. Ensure HTTPS or localhost is used.');
        console.error(err);
    }
}
initCamera();

zoomSlider.addEventListener('input', async (e) => {
    currentZoom = parseFloat(e.target.value);
    zoomText.textContent = currentZoom.toFixed(1) + 'x';

    if (videoTrack && videoTrack.applyConstraints) {
        try {
            await videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
        } catch (err) {
            video.style.transform = `scale(${currentZoom})`;
        }
    }
});

presetSelect.addEventListener('change', (e) => {
    customGroup.style.display = e.target.value === 'custom' ? 'flex' : 'none';
});

function getObjectRealWidth() {
    if (presetSelect.value === 'custom') {
        return parseFloat(customSizeInput.value) || 10;
    }
    return parseFloat(presetSelect.value);
}

function updateCrosshairPos() {
    activeCrosshair.style.left = `${crosshairX}px`;
    activeCrosshair.style.top = `${crosshairY}px`;
}

// Make active crosshair draggable anywhere with touch/mouse
activeCrosshair.addEventListener('pointerdown', (e) => {
    isDraggingCrosshair = true;
    activeCrosshair.setPointerCapture(e.pointerId);
});

activeCrosshair.addEventListener('pointermove', (e) => {
    if (!isDraggingCrosshair) return;
    const rect = viewport.getBoundingClientRect();
    crosshairX = e.clientX - rect.left;
    crosshairY = e.clientY - rect.top;
    updateCrosshairPos();
});

activeCrosshair.addEventListener('pointerup', (e) => {
    isDraggingCrosshair = false;
    activeCrosshair.releasePointerCapture(e.pointerId);
});

// Also allow dragging anywhere on the viewport when placing
viewport.addEventListener('pointerdown', (e) => {
    if (!markingState) return;
    const rect = viewport.getBoundingClientRect();
    crosshairX = e.clientX - rect.left;
    crosshairY = e.clientY - rect.top;
    updateCrosshairPos();
    isDraggingCrosshair = true;
});

viewport.addEventListener('pointermove', (e) => {
    if (!isDraggingCrosshair || !markingState) return;
    const rect = viewport.getBoundingClientRect();
    crosshairX = e.clientX - rect.left;
    crosshairY = e.clientY - rect.top;
    updateCrosshairPos();
});

viewport.addEventListener('pointerup', () => {
    isDraggingCrosshair = false;
});

// Step 1: Initialize Left Edge
leftBtn.addEventListener('click', () => {
    markingState = 'left';
    crosshairX = viewport.clientWidth / 2;
    crosshairY = viewport.clientHeight / 2;
    updateCrosshairPos();
    activeCrosshair.style.display = 'block';

    leftBtn.style.display = 'none';
    confirmLeftBtn.style.display = 'block';
    instructionBanner.innerHTML = "Slide the yellow crosshair onto the <b>left edge</b>, then tap Confirm.";
});

// Confirm Left Edge
confirmLeftBtn.addEventListener('click', () => {
    const rect = video.getBoundingClientRect();
    const clientX = crosshairX;
    const clientY = crosshairY;

    const scaleX = video.videoWidth / rect.width;
    const scaleY = video.videoHeight / rect.height;

    leftPoint = { x: clientX * scaleX, y: clientY * scaleY };
    
    lockedMarker1.style.left = `${clientX}px`;
    lockedMarker1.style.top = `${clientY}px`;
    lockedMarker1.style.display = 'block';

    activeCrosshair.style.display = 'none';
    confirmLeftBtn.style.display = 'none';

    rightBtn.style.display = 'block';
    rightBtn.disabled = false;
    rightBtn.classList.remove('btn-secondary');
    rightBtn.style.background = '#38bdf8';
    rightBtn.style.color = '#0f172a';
    instructionBanner.innerHTML = "Step 2: Tap <b>2. Set Right Edge</b>.";
    markingState = null;
});

// Step 2: Initialize Right Edge
rightBtn.addEventListener('click', () => {
    markingState = 'right';
    // Keep Y aligned with left point so height is locked perfectly!
    crosshairY = parseFloat(lockedMarker1.style.top);
    crosshairX = viewport.clientWidth / 2 + 50;
    updateCrosshairPos();
    activeCrosshair.style.display = 'block';

    rightBtn.style.display = 'none';
    confirmRightBtn.style.display = 'block';
    instructionBanner.innerHTML = "Slide the crosshair to the <b>right edge</b> (height is locked horizontally), then tap Confirm.";
});

// Confirm Right Edge
confirmRightBtn.addEventListener('click', () => {
    const rect = video.getBoundingClientRect();
    const clientX = crosshairX;
    const clientY = crosshairY;

    const scaleX = video.videoWidth / rect.width;
    const scaleY = video.videoHeight / rect.height;

    rightPoint = { x: clientX * scaleX, y: clientY * scaleY };

    lockedMarker2.style.left = `${clientX}px`;
    lockedMarker2.style.top = `${clientY}px`;
    lockedMarker2.style.display = 'block';

    activeCrosshair.style.display = 'none';
    confirmRightBtn.style.display = 'none';

    calcBtn.style.display = 'block';
    instructionBanner.innerHTML = "Both edges confirmed! Tap <b>Calculate Distance</b>.";
    markingState = null;
});

calcBtn.addEventListener('click', () => {
    if (!leftPoint || !rightPoint) return;

    let realWidthCm = getObjectRealWidth();
    let pixelWidth = Math.abs(rightPoint.x - leftPoint.x);
    let calibrationMultiplier = parseFloat(calibInput.value) || 1.0;

    let baseFocalLength = video.videoWidth * 1.15 * calibrationMultiplier;
    let effectiveFocalLength = baseFocalLength * currentZoom;

    let distanceCm = (realWidthCm * effectiveFocalLength) / pixelWidth;
    let distanceMeters = distanceCm / 100;
    let distanceFeet = distanceMeters * 3.28084;

    if (distanceMeters < 0.1 || distanceMeters > 100) {
        distanceVal.textContent = "Out of range";
    } else {
        distanceVal.textContent = `${distanceMeters.toFixed(2)} m (${distanceFeet.toFixed(1)} ft)`;
    }

    calcBtn.style.display = 'none';
    resetBtn.style.display = 'block';
    instructionBanner.innerHTML = "Measurement complete!";
});

resetBtn.addEventListener('click', () => {
    lockedMarker1.style.display = 'none';
    lockedMarker2.style.display = 'none';
    activeCrosshair.style.display = 'none';
    calcBtn.style.display = 'none';
    resetBtn.style.display = 'none';

    leftBtn.style.display = 'block';
    leftBtn.disabled = false;
    leftBtn.style.background = '#38bdf8';
    leftBtn.style.color = '#0f172a';
    leftBtn.textContent = '1. Set Left Edge';

    rightBtn.style.display = 'block';
    rightBtn.disabled = true;
    rightBtn.classList.add('btn-secondary');
    rightBtn.textContent = '2. Set Right Edge';

    leftPoint = null;
    rightPoint = null;
    distanceVal.textContent = '--';
    instructionBanner.innerHTML = "Step 1: Tap <b>1. Set Left Edge</b> to place the sliding crosshair.";
});
</script>

</body>
</html>
